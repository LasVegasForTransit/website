name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: write
  packages: read

concurrency:
  group: website-staging
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-build.yml@94842f40fa6d912249860b34a61d314adcaa19b6
    with:
      artifact-source: typed-worker
      require-analytics: true
      app-directory: apps/site
      validation-browser-directory: apps/site
      artifact-prefix: website-release
    secrets: inherit

  artifact-validation:
    name: Validate retained release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Checkout selected source without deployment credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate retained interface
        uses: ./.github/actions/validate-retained-ui
        with:
          artifact-name: website-release-${{ github.run_id }}
          commit: ${{ github.sha }}
          release-id: ${{ github.run_id }}

  attest:
    name: Sign retained release
    needs: [build, artifact-validation]
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: write
      id-token: write
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-attest.yml@3567f0cb1345e8756eb5d84e0a3ea7b62695125a
    with:
      artifact-prefix: website-release

  staging:
    name: Verify and update staging
    needs: [build, attest]
    if: github.ref == 'refs/heads/main'
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-publish.yml@141cafabceeebaef795812d530f573e56e01d2df
    with:
      target: preview
      release-id: ${{ github.run_id }}
      commit: ${{ github.sha }}
      artifact-prefix: website-release
      attestation-prefix: attestation-website-release
      app-directory: apps/site
      url: https://preview.lasvegasfortransit.org
      smoke-script: worker:smoke
      browser-script: worker:test:browser
      browser-project: hosted-acceptance
    secrets: inherit
