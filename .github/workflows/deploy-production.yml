name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: write
  packages: read

concurrency:
  group: website-staging
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-build.yml@ac987b64a242c142b668abed03fb0aca73632767
    with:
      artifact-source: typed-worker
      require-analytics: true
      app-directory: apps/site
      validation-browser-directory: apps/site
      artifact-prefix: website-release
    secrets: inherit

  attest:
    name: Sign retained release
    needs: build
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: write
      id-token: write
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-attest.yml@ac987b64a242c142b668abed03fb0aca73632767
    with:
      artifact-prefix: website-release

  staging:
    name: Verify and update staging
    needs: [build, attest]
    if: github.ref == 'refs/heads/main'
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-publish.yml@ac987b64a242c142b668abed03fb0aca73632767
    with:
      target: preview
      release-id: ${{ github.run_id }}
      commit: ${{ github.sha }}
      artifact-prefix: website-release
      attestation-prefix: attestation-website-release
      app-directory: apps/site
      url: https://preview.lasvegasfortransit.org
      smoke-script: worker:smoke
      browser-script: worker:test:browser
      browser-project: ui-contracts
    secrets: inherit
