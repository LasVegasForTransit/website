name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  packages: read

# Never cancel a prod deploy in flight — let it finish, then queue the next.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deployment config baked into the static HTML — see src/lib/site.ts.
    # Job env propagates into the build-site composite step.
    env:
      PUBLIC_LVBT_INSTAGRAM: ${{ vars.PUBLIC_LVBT_INSTAGRAM }}
      PUBLIC_LVBT_LINKEDIN: ${{ vars.PUBLIC_LVBT_LINKEDIN }}
      PUBLIC_LVBT_BLUESKY: ${{ vars.PUBLIC_LVBT_BLUESKY }}
      PUBLIC_LVBT_DISCORD: ${{ vars.PUBLIC_LVBT_DISCORD }}
      PUBLIC_LVBT_DONATE_URL: ${{ vars.PUBLIC_LVBT_DONATE_URL }}
      PUBLIC_LVBT_MEMBERSHIP_FORM_URL: ${{ vars.PUBLIC_LVBT_MEMBERSHIP_FORM_URL }}
      PUBLIC_LVBT_NEWSLETTER_URL: ${{ vars.PUBLIC_LVBT_NEWSLETTER_URL }}
      PUBLIC_LVBT_NEWSLETTER_FEED_URL: ${{ vars.PUBLIC_LVBT_NEWSLETTER_FEED_URL }}
      PUBLIC_LVBT_CWA_TOKEN: ${{ vars.PUBLIC_LVBT_CWA_TOKEN }}
      LVBT_REQUIRE_ANALYTICS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build site
        uses: ./.github/actions/build-site

      # The pattern gallery, prototypes and the en-XA test language exist only
      # on previews and the audit. A production build with any of them must
      # never deploy.
      - name: Check preview-only pages are absent
        run: |
          if [ -e dist/patterns ] || [ -e dist/prototypes ]; then
            echo "::error::dist/patterns or dist/prototypes is in the production build."
            exit 1
          fi
          # The en-XA long-text language is for the audit only.
          if grep -rlq 'lang="en-XA"' dist --include='*.html'; then
            echo "::error::The production build is in the en-XA test language. Unset LVBT_PSEUDO_LOCALE."
            exit 1
          fi

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scopes secrets to the production environment + surfaces a deployment
    # record in the GitHub UI. Add required reviewers via repo settings if
    # you want a manual approval gate later.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Deploy
        id: deploy
        uses: ./.github/actions/deploy-cloudflare-pages
        with:
          branch: main
