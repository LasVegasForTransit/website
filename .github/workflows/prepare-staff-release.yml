name: Prepare staff release

on:
  workflow_dispatch:
    inputs:
      release_run:
        description: Successful Build staff release Actions run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: staff-release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify saved staff release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Retrieve and verify selected build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.release_run }}
        run: >-
          pnpm staff:release prepare --directory "$RUNNER_TEMP/staff-release" --repository
          "$GITHUB_REPOSITORY" --run-id "$RELEASE_RUN"
      - name: Check saved Workers without rebuilding
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_ID: ${{ steps.release.outputs.release-id }}
        run: >-
          pnpm staff:release check --directory "$RUNNER_TEMP/staff-release" --commit
          "$RELEASE_COMMIT" --release-id "$RELEASE_ID"
      - name: Install Chromium
        run: pnpm -C apps/staff exec playwright install --with-deps chromium
      - name: Verify saved artifact runtime
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_ID: ${{ steps.release.outputs.release-id }}
        run: >-
          pnpm -C apps/staff test:release --directory "$RUNNER_TEMP/staff-release" --commit
          "$RELEASE_COMMIT" --release-id "$RELEASE_ID"
      - name: Record verified source
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_ID: ${{ steps.release.outputs.release-id }}
          ARTIFACT_HASH: ${{ steps.release.outputs.artifact-hash }}
        run: |
          {
            echo '### Staff release prepared'
            echo "Source build: $RELEASE_ID"
            echo "Commit: $RELEASE_COMMIT"
            echo "Artifact hash: $ARTIFACT_HASH"
            echo 'The saved staff and jobs bundles passed local checks. No deployment occurred.'
          } >> "$GITHUB_STEP_SUMMARY"
