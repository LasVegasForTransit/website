name: Audit

# Site-quality gates: performance, accessibility, SEO, security, content.
# Each tool is a separate job so the PR check list shows per-dimension status.
#
# Most jobs are hard gates. The remaining soft-fails (continue-on-error)
# are jobs that still need a real baseline before they can block merge —
# lighthouse-mobile until a first clean run, visual-regression until linux
# baselines are seeded, content-lint until one clean week (it surfaces
# advisory findings that are judgment calls, not regressions). Each one
# carries a TODO at its declaration.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Deployment config baked into the static HTML — see src/lib/site.ts.
    # Job env propagates into the build-site composite step.
    env:
      PUBLIC_LVBT_INSTAGRAM: ${{ vars.PUBLIC_LVBT_INSTAGRAM }}
      PUBLIC_LVBT_LINKEDIN: ${{ vars.PUBLIC_LVBT_LINKEDIN }}
      PUBLIC_LVBT_BLUESKY: ${{ vars.PUBLIC_LVBT_BLUESKY }}
      PUBLIC_LVBT_DISCORD: ${{ vars.PUBLIC_LVBT_DISCORD }}
      PUBLIC_LVBT_DONATE_URL: ${{ vars.PUBLIC_LVBT_DONATE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build site
        uses: ./.github/actions/build-site

  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Run Lighthouse
        run: pnpm exec lhci autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-${{ github.sha }}
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

  lighthouse-mobile:
    name: Lighthouse (mobile)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Run Lighthouse (mobile preset)
        env:
          LIGHTHOUSE_PRESET: mobile
        run: pnpm exec lhci autorun

      - name: Upload Lighthouse mobile reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-mobile-${{ github.sha }}
          # outputDir for LIGHTHOUSE_PRESET=mobile in lighthouserc.cjs.
          path: .lighthouseci-mobile/
          if-no-files-found: ignore
          retention-days: 14

  axe:
    name: Accessibility (axe)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm test:install

      - name: Install system deps for headless Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run axe
        run: pnpm check:a11y

  perf-memory:
    name: Runtime memory
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GATING from day one. Budget is 30 MB usedJsHeapSize per page after a
    # CDP-driven GC, against a baseline that lands far below that today.
    # A breach means a new JS retainer slipped in.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm test:install

      - name: Install system deps for headless Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run perf-memory spec
        # AUDIT_SKIP_BUILD reuses the dist artifact downloaded above instead
        # of triggering Playwright's webServer to rebuild — the perf-memory
        # spec reads dist/sitemap-0.xml at module load and ENOENTs if a
        # parallel worker rewrites it mid-import.
        env:
          AUDIT_SKIP_BUILD: '1'
        run: pnpm exec playwright test --project=perf-memory --reporter=line

  visual-regression:
    name: Visual regression
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # TODO: promote to hard gate once linux baselines are seeded into
    # tests/snapshots/linux/{mobile-portrait,desktop}/. Until then the
    # job reports diffs (and writes baselines on first run) without
    # blocking merge — see tests/README.md → "Seeding linux baselines".
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm test:install

      - name: Install system deps for headless Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run visual regression (mobile-portrait + desktop)
        # Two viewports while we get the linux baseline workflow stable;
        # expand to the full six once the seeding ritual is well-trodden.
        env:
          AUDIT_SKIP_BUILD: '1'
        run: |
          pnpm exec playwright test \
            --project=mobile-portrait \
            --project=desktop \
            --reporter=line

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  html-validate:
    name: HTML validate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Run html-validate
        run: pnpm check:html

  bundle-size:
    name: Bundle size budget
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # GATING from day one. Budgets in perf-budgets.json are sized off the
    # current build with headroom (~50% over today's gzipped totals); first
    # breach is real signal, not noise.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Measure bundle sizes
        run: pnpm exec tsx scripts/audit/bundle-size.ts

  asset-budget:
    name: Image asset budget
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # GATING from day one. Reads public/ from the checkout — no need for
    # the build artifact, no `needs: build`. Catches any raster image over
    # 20 KB that ships without a .webp companion.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Check image budgets
        run: pnpm exec tsx scripts/audit/asset-budget.ts

  structured-data:
    name: Structured data
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # GATING — baseline 2026-05-01 was clean; regressions block merge.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Validate JSON-LD
        run: pnpm check:structured-data

  third-party-scan:
    name: Third-party scan
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reporting only (script always exit 0). Surfaces unintended new
    # off-origin sources in the build for human review.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Scan
        run: pnpm check:third-party

  deps-audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Gates on high/critical (--audit-level=high). Production tree is
    # clean at that level today; a future intro of a high/critical
    # transitive blocks merge until it's patched or accepted.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Audit
        run: pnpm audit --prod --audit-level=high

  content-lint:
    name: Content lint (alex + cspell)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Soft-fail until one clean week, per the audit plan. Findings are
    # advisory and judgment calls; they shouldn't block merge by default.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run alex + cspell
        run: pnpm check:content
