name: Promote website release
run-name: "Promote website: ${{ inputs.request_id || inputs.run_id || 'current preview' }}"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional successful main Deploy staging run ID; omit to promote current preview
        type: string
        required: false

      request_id:
        description: Optional correlation ID supplied by pnpm promote
        type: string
        required: false
      expected_version:
        description:
          Optional current production version; required if production has no release marker
        type: string
        required: false

permissions:
  contents: read
  actions: read
  deployments: write
  packages: read

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  source:
    name: Resolve and validate staging release
    if: github.ref == 'refs/heads/main' && github.repository == 'LasVegasForTransit/website'
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-source.yml@ac987b64a242c142b668abed03fb0aca73632767
    with:
      run-id: ${{ inputs.run_id }}
    secrets: inherit

  promote:
    name: Verify and publish selected release
    needs: source
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-publish.yml@ac987b64a242c142b668abed03fb0aca73632767
    with:
      target: production
      expected-version: ${{ inputs.expected_version }}
      release-id: ${{ needs.source.outputs.release-id }}
      commit: ${{ needs.source.outputs.commit }}
      artifact-prefix: website-release
      attestation-prefix: attestation-website-release
      legacy-artifact: ${{ needs.source.outputs.legacy == 'true' }}
      app-directory: apps/site
      url: https://lasvegasfortransit.org
      smoke-script: worker:smoke
      browser-script: worker:test:browser
      browser-project: ui-contracts
    secrets: inherit
