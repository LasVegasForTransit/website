name: Promote website release
run-name: "Promote website: ${{ inputs.request_id || inputs.run_id || 'current preview' }}"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional successful main Deploy staging run ID; omit to promote current preview
        type: string
        required: false

      request_id:
        description: Optional correlation ID supplied by pnpm promote
        type: string
        required: false

permissions:
  contents: read
  actions: read
  deployments: write
  packages: read

concurrency:
  group: website-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/site

jobs:
  source:
    name: Resolve and validate staging release
    if: github.ref == 'refs/heads/main' && github.repository == 'LasVegasForTransit/website'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: worker-preview
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      release-id: ${{ steps.source.outputs.release-id }}
    steps:
      - name: Checkout trusted promotion tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Node + pnpm
        id: setup
        uses: ./.github/actions/setup-node-pnpm
      - name: Resolve current preview or explicit release and validate provenance
        id: source
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: >-
          pnpm worker:release source --repository "$GITHUB_REPOSITORY" --run-id "$SOURCE_RUN_ID"

  promote:
    name: Verify and publish selected release
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Existing production credential environment; dispatch is the explicit publish action.
    environment:
      name: worker-candidate
      url: https://lasvegasfortransit.org
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      RELEASE_ID: ${{ needs.source.outputs.release-id }}
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - name: Checkout release verification tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: true
      - name: Setup Node + pnpm
        id: setup
        uses: ./.github/actions/setup-node-pnpm
      - name: Record current production identity
        run: pnpm worker:publication baseline --directory "$RUNNER_TEMP/publication"
      - name: Download selected immutable release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.release-id }}
          name: website-release-${{ needs.source.outputs.release-id }}
          path: ${{ runner.temp }}/website-release
      - name: Verify artifact identity and files
        run: >-
          pnpm worker:release verify --directory "$RUNNER_TEMP/website-release" --commit
          "$RELEASE_COMMIT" --release-id "$RELEASE_ID"
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Upload production candidate without rebuilding
        id: upload
        run:
          pnpm worker:release upload --directory "$RUNNER_TEMP/website-release" --target production
      - name: Verify production candidate
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        run: >-
          pnpm worker:smoke --url "$PREVIEW_URL" --commit "$RELEASE_COMMIT" --release-id
          "$RELEASE_ID"
      - name: Browser acceptance
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.upload.outputs.url }}
        run: |
          cp -R "$RUNNER_TEMP/website-release/dist" ./dist
          pnpm worker:test:browser --project=ui-contracts
      - name: Activate verified production version
        id: activate
        env:
          VERSION_ID: ${{ steps.upload.outputs.version }}
        run: pnpm worker:release activate --target production --version "$VERSION_ID"
      - name: Verify public deployment
        id: public
        run: >-
          pnpm worker:smoke --url https://lasvegasfortransit.org --commit "$RELEASE_COMMIT"
          --release-id "$RELEASE_ID" --wait-for-propagation --public
      - name: Record publication outcome
        if: always() && steps.setup.outcome == 'success'
        env:
          VERSION_ID: ${{ steps.upload.outputs.version }}
          ARTIFACT_HASH: ${{ steps.upload.outputs.artifact-hash }}
          ACTIVATION: ${{ steps.activate.outcome }}
          VERIFICATION: ${{ steps.public.outcome }}
        run: >-
          pnpm worker:publication record --directory "$RUNNER_TEMP/publication" --release-id
          "$RELEASE_ID" --commit "$RELEASE_COMMIT" --version "$VERSION_ID" --artifact-hash
          "$ARTIFACT_HASH" --activation "$ACTIVATION" --verification "$VERIFICATION"
      - name: Retain publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication/
          if-no-files-found: warn
          retention-days: 90
