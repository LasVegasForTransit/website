name: Promote website release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main Deploy staging Actions run ID to promote
        type: string
        required: true

permissions:
  contents: read
  actions: read
  deployments: write
  packages: read

concurrency:
  group: website-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/site

jobs:
  source:
    name: Validate selected staging release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      release-id: ${{ steps.source.outputs.release-id }}
    steps:
      - name: Checkout trusted promotion tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Fetch selected Actions run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const id = process.env.SOURCE_RUN_ID;
            if (!/^[1-9][0-9]*$/.test(id)) throw new Error('Select an Actions run ID.');
            const { data } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(id) });
            require('node:fs').writeFileSync(`${process.env.RUNNER_TEMP}/source-run.json`, JSON.stringify(data));
      - name: Validate provenance
        id: source
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: >-
          pnpm worker:release source --run-file "$RUNNER_TEMP/source-run.json" --repository
          "$GITHUB_REPOSITORY" --run-id "$SOURCE_RUN_ID"

  promote:
    name: Verify and publish selected release
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Existing production credential environment; dispatch is the explicit publish action.
    environment:
      name: worker-candidate
      url: https://lasvegasfortransit.org
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      RELEASE_ID: ${{ needs.source.outputs.release-id }}
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - name: Checkout release verification tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
          lfs: true
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Download selected immutable release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: website-release-${{ needs.source.outputs.release-id }}
          path: ${{ runner.temp }}/website-release
      - name: Verify artifact identity and files
        run: >-
          pnpm worker:release verify --directory "$RUNNER_TEMP/website-release" --commit
          "$RELEASE_COMMIT" --release-id "$RELEASE_ID"
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Upload production candidate without rebuilding
        id: upload
        run:
          pnpm worker:release upload --directory "$RUNNER_TEMP/website-release" --target production
      - name: Verify production candidate
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        run: >-
          pnpm worker:smoke --url "$PREVIEW_URL" --commit "$RELEASE_COMMIT" --release-id
          "$RELEASE_ID"
      - name: Browser acceptance
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.upload.outputs.url }}
        run: |
          cp -R "$RUNNER_TEMP/website-release/dist" ./dist
          pnpm worker:test:browser --project=ui-contracts
      - name: Activate verified production version
        env:
          VERSION_ID: ${{ steps.upload.outputs.version }}
        run: pnpm worker:release activate --target production --version "$VERSION_ID"
      - name: Verify public deployment
        run: >-
          pnpm worker:smoke --url https://lasvegasfortransit.org --commit "$RELEASE_COMMIT"
          --release-id "$RELEASE_ID"
      - name: Record publication
        env:
          VERSION_ID: ${{ steps.upload.outputs.version }}
        run: |
          {
            echo '### Website release published'
            echo "Release: $RELEASE_ID"
            echo "Commit: $RELEASE_COMMIT"
            echo "Production Worker version: $VERSION_ID"
            echo 'Public site: https://lasvegasfortransit.org'
          } >> "$GITHUB_STEP_SUMMARY"
