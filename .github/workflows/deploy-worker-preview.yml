name: Deploy Worker preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  preview:
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-pr-preview-build.yml@09262d57ffbc0dc03120e15e7f257e1f5a28f43e
    with:
      enabled: ${{ vars.CLOUDFLARE_WORKERS_PREVIEW_ENABLED == 'true' }}
      artifact-prefix: website-release
      validation-browser-directory: apps/site
      require-analytics: true
      preview-pages: true
