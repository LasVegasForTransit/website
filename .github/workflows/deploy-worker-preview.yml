name: Deploy Worker preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write
  packages: read
  pull-requests: write

jobs:
  preview:
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-pr-preview.yml@3567f0cb1345e8756eb5d84e0a3ea7b62695125a
    with:
      enabled: ${{ vars.CLOUDFLARE_WORKERS_PREVIEW_ENABLED == 'true' }}
      publication-mode: version
      preview-environment: worker-preview
      protection: access
      app-directory: apps/site
      preview-script: worker:preview
      smoke-script: worker:smoke
      browser-script: worker:test:browser
      browser-project: ui-contracts
      require-analytics: true
      preview-pages: true
    secrets: inherit
