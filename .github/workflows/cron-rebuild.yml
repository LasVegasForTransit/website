name: cron-rebuild

# Periodic staging refresh so the events page picks up Google Calendar changes
# without anyone having to push. Triggers `Deploy staging` via
# workflow_dispatch — that workflow re-fetches the public LVBT calendar
# during its build.
#

# Cadence: twice daily at 02:00 and 14:00 UTC — roughly 7am and 7pm PT
# during PDT, 6am and 6pm during PST. Tighten the cron if events start
# changing more often than morning/evening.
#
# Pipeline doc: docs/explanation/events-pipeline.md

on:
  schedule:
    - cron: '0 2,14 * * *'
  # Manual button in the Actions UI for ad-hoc rebuilds (e.g. after a
  # same-day calendar correction that cannot wait for the next scheduled build).
  workflow_dispatch:

permissions:
  # Only what's needed to dispatch another workflow.
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Deploy staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-production.yml --ref main --repo ${{ github.repository }}
