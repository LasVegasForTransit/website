name: Build site
description: >
  Build the static site to apps/site/dist (validation is the Validate job). Uploads the build as an
  artifact named dist-<sha> for downstream deploy jobs to download.

  Assumes `setup-node-pnpm` has already run in the same job.

runs:
  using: composite
  steps:
    - name: Restore Astro cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: apps/site/.astro
        key:
          astro-${{ runner.os }}-${{ hashFiles('apps/site/astro.config.mjs', 'pnpm-lock.yaml',
          'apps/site/src/content/**') }}
        restore-keys: |
          astro-${{ runner.os }}-

    - name: Build
      shell: bash
      run: pnpm build

    - name: Upload dist artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-${{ github.sha }}
        path: apps/site/dist/
        if-no-files-found: error
        retention-days: 7
