name: Build site
description: >
  Run the canonical validation chain (typecheck, lint:check, check:docs) and
  build the static site to ./dist. Uploads the build as an artifact named
  dist-<sha> for downstream deploy jobs to download.

  Assumes `setup-node-pnpm` has already run in the same job.

runs:
  using: composite
  steps:
    - name: Restore Astro cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: .astro
        key: astro-${{ runner.os }}-${{ hashFiles('astro.config.mjs', 'pnpm-lock.yaml', 'src/content/**') }}
        restore-keys: |
          astro-${{ runner.os }}-

    - name: Typecheck
      shell: bash
      run: pnpm typecheck

    - name: Lint check
      shell: bash
      run: pnpm lint:check

    - name: Validate doc links
      shell: bash
      run: pnpm check:docs

    # Deployment config (social/donate/Discord URLs) is sourced from env at
    # build time — see src/lib/site.ts. The values live as repository variables
    # so an unset one is loud (the build warns) rather than silently shipping a
    # stale literal. A missing var hides its link; it does not fail the build.
    - name: Build
      shell: bash
      env:
        PUBLIC_LVBT_INSTAGRAM: ${{ vars.PUBLIC_LVBT_INSTAGRAM }}
        PUBLIC_LVBT_LINKEDIN: ${{ vars.PUBLIC_LVBT_LINKEDIN }}
        PUBLIC_LVBT_BLUESKY: ${{ vars.PUBLIC_LVBT_BLUESKY }}
        PUBLIC_LVBT_DISCORD: ${{ vars.PUBLIC_LVBT_DISCORD }}
        PUBLIC_LVBT_DONATE_URL: ${{ vars.PUBLIC_LVBT_DONATE_URL }}
      run: pnpm build

    - name: Upload dist artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-${{ github.sha }}
        path: dist/
        if-no-files-found: error
        retention-days: 7
