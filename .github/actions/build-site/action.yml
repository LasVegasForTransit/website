name: Build site
description: >
  Run the repository's complete pnpm check and upload the resulting static
  site as dist-<sha> for downstream deploy jobs to download.

  Assumes `setup-node-pnpm` has already run in the same job.

runs:
  using: composite
  steps:
    - name: Restore Astro cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: .astro
        key: astro-${{ runner.os }}-${{ hashFiles('astro.config.mjs', 'pnpm-lock.yaml', 'src/content/**') }}
        restore-keys: |
          astro-${{ runner.os }}-

    # Reads the PUBLIC_LVBT_* deployment config (social/donate/Discord URLs)
    # from the job environment — `vars`/`env` contexts can't be referenced
    # inside a composite action, so the calling workflow's `build` job exports
    # these via its own `env:` block (which propagates into composite steps).
    # See src/lib/site.ts; an unset var hides its link and warns, never fails.
    - name: Check and build
      shell: bash
      run: pnpm check

    - name: Upload dist artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-${{ github.sha }}
        path: dist/
        if-no-files-found: error
        retention-days: 7
