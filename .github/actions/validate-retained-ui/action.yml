name: Validate retained interface
description: Check the exact packaged Worker and assets locally before publication.

inputs:
  artifact-name:
    description: Exact immutable artifact name from this workflow run
    required: true
  commit:
    description: Expected source commit in the retained release
    required: true
  release-id:
    description: Expected build run in the retained release
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node + pnpm
      uses: ./.github/actions/setup-node-pnpm
    - name: Install validation browser
      shell: bash
      run: pnpm --dir apps/site exec playwright install --with-deps chromium
    - name: Download selected retained artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/retained-ui-artifact/
    - name: Validate exact retained Worker and assets locally
      shell: bash
      env:
        ARTIFACT_DIRECTORY: ${{ runner.temp }}/retained-ui-artifact
        RELEASE_COMMIT: ${{ inputs.commit }}
        RELEASE_ID: ${{ inputs.release-id }}
      run: >-
        pnpm --dir apps/site test:ui-contracts --artifact "$ARTIFACT_DIRECTORY" --commit
        "$RELEASE_COMMIT" --release-id "$RELEASE_ID"
