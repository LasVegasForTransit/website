# Secret scanning. Extends gitleaks' upstream ruleset; everything below is an
# exemption for paths that carry no secrets but trip generic entropy rules.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "The staff preview Access audience is a public application identifier."
condition = "AND"
paths = ['''^apps/staff/wrangler\.jsonc$''']
regexTarget = "line"
regexes = ['''^\s*"LVBT_ACCESS_AUD": "f89573338a947c9027f83748935d86f62041adba8672ab807c1634a85c85ef69",$''']

[[allowlists]]
description = "Paths that carry no secrets but trip generic entropy rules."
paths = [
  '''pnpm-lock\.yaml''',
  '''docs/superpowers/.*\.md''',
]

[[allowlists]]
description = "Release manifests list Discord variable names, not secret values."
paths = ['''^apps/staff/scripts/release-config\.ts$''']
regexTarget = "line"
regexes = ['''^\s*'LVBT_DISCORD_(?:SYNC_ENABLED|APPLICATION_ID|GUILD_ID|PRODUCTION_GUILD_ID|MEMBER_ROLE_ID)',$''']

[[allowlists]]
description = "Committee settings tests use public Discord role IDs."
paths = ['''^packages/platform-storage/tests/committee-settings\.test\.ts$''']
regexTarget = "line"
regexes = ['''^\s*discordRoleId:\s*(?:discordSnowflake\(\d+\)|'\d{17,20}'),$''']
