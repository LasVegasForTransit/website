packages:
  - 'apps/*'
  - 'packages/*'

# Dependencies allowed to run install scripts. Everything else installs
# without them, so a compromised package cannot run code at install time.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# A release must be at least one day old before it installs, so a package
# that is compromised and yanked the same day never reaches a repository.
minimumReleaseAge: 1440

# The organization version baseline. Every LVBT repository carries this same
# catalog, so a package declares "catalog:" and two repositories cannot drift
# onto different versions of one tool without it showing up as a change here.
# Renovate keeps it current.
catalog:
  '@astrojs/check': 0.9.10
  '@astrojs/mdx': 8.0.0
  '@astrojs/sitemap': 3.7.4
  '@axe-core/playwright': 4.11.3
  '@clack/prompts': 1.4.0
  '@cloudflare/vitest-pool-workers': 0.22.0
  '@cloudflare/workers-types': 5.20260901.1
  '@eslint-community/eslint-plugin-eslint-comments': 4.7.2
  '@eslint/js': 10.0.1
  '@iconify-json/mdi': 1.2.3
  '@lhci/cli': 0.15.1
  '@playwright/test': 1.62.1
  '@tailwindcss/typography': 0.5.20
  '@tailwindcss/vite': 4.3.3
  '@types/node': 24.13.3
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5
  '@vitejs/plugin-react': 6.1.1
  alex: 11.0.1
  astro: 7.2.10
  astro-icon: 1.2.0
  cspell: 10.0.0
  eslint: 10.9.1
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-sonarjs: 4.2.0
  eslint-plugin-turbo: 2.10.12
  fast-xml-parser: 5.9.2
  globals: 17.11.0
  hono: 4.13.5
  html-validate: 11.2.0
  ical.js: 2.2.1
  lint-staged: 17.4.1
  markdownlint-cli2: 0.23.2
  markdownlint-rule-relative-links: 5.1.2
  pagefind: 1.5.2
  picocolors: 1.1.1
  playwright-core: 1.62.1
  portless: 0.15.1
  prettier: 3.9.6
  prettier-plugin-astro: 0.14.1
  react: 19.2.8
  react-dom: 19.2.8
  sitemap: 9.0.1
  stylelint: 17.14.0
  tailwindcss: 4.3.3
  tslib: 2.8.1
  tsx: 4.23.13
  turbo: 2.10.12
  typescript: 6.0.3
  typescript-eslint: 8.69.0
  vite: 8.2.2
  vitest: 4.1.11
  wrangler: 4.127.1
  zod: 4.5.4

# lhci bundles intl-messageformat which CommonJS-requires tslib without
# declaring it. Hoist tslib to the public node_modules root so the bundled
# Lighthouse subprocess can resolve it.
publicHoistPattern:
  - 'tslib'

# Security overrides for transitive dependencies the audit flags; drop each
# once the parent package pulls in the patched release.
overrides:
  'brace-expansion@<1.1.16': '>=1.1.16'
  'brace-expansion@<1.1.17': '>=1.1.17'
  'brace-expansion@<1.1.18': '>=1.1.18'
  'brace-expansion@>=2.0.0 <2.1.2': '>=2.1.2'
  'brace-expansion@>=2.0.0 <2.1.3': '>=2.1.3'
  'brace-expansion@>=2.0.0 <2.1.4': '>=2.1.4'
  'ip-address@<=10.3.0': '>=10.3.1'
  'js-yaml@>=3.0.0 <3.15.0': '>=3.15.0'
  'js-yaml@>=3.0.0 <3.15.1': '>=3.15.1'
  'js-yaml@>=4.0.0 <4.3.0': '>=4.3.0'
  'js-yaml@>=4.0.0 <4.3.1': '>=4.3.1'
  'nanoid@<3.3.16': '>=3.3.16'
  'nanoid@<3.3.18': '>=3.3.18'
  'postcss@<=8.5.17': '>=8.5.18'
  'svgo@>=4.0.0 <4.0.2': '>=4.0.2'
  'tmp@<0.2.6': '>=0.2.6'
  'ws@>=7.0.0 <7.5.11': '>=7.5.11'

# extract-zip (through @lhci/cli, Lighthouse, Puppeteer) has a high advisory with
# no patched release; it only ever unpacks Chromium downloads in CI.
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
