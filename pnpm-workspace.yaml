# pnpm 10 requires `packages` whenever pnpm-workspace.yaml exists, even for
# single-package repos like this one. Listing the repo root keeps pnpm settings
# (onlyBuiltDependencies, peerDependencyRules) co-located with the package.
packages:
  - .

minimumReleaseAge: 1440

overrides:
  sharp: 0.35.4
  smol-toml: 1.8.0
  svgo: 4.1.0

catalog:
  '@astrojs/check': 0.9.10
  '@astrojs/mdx': 8.0.1
  '@astrojs/sitemap': 3.7.4
  '@axe-core/playwright': 4.13.0
  '@clack/prompts': 1.4.0
  '@cloudflare/workers-types': 5.20260901.1
  '@iconify-json/mdi': 1.2.3
  '@lhci/cli': 0.15.1
  '@playwright/test': 1.62.1
  '@tailwindcss/typography': 0.5.20
  '@tailwindcss/vite': 4.3.3
  '@types/node': 24.13.3
  alex: 11.0.1
  astro: 7.2.10
  astro-icon: 1.2.0
  cspell: 10.0.0
  eslint: 10.9.1
  fast-xml-parser: 5.9.2
  html-validate: 11.2.0
  ical.js: 2.2.1
  lint-staged: 17.4.1
  pagefind: 1.5.2
  picocolors: 1.1.1
  portless: 0.15.1
  prettier: 3.9.6
  prettier-plugin-astro: 0.14.1
  sitemap: 9.0.1
  stylelint: 17.14.0
  tailwindcss: 4.3.3
  tslib: 2.8.1
  tsx: 4.23.13
  typescript: 6.0.3
  wrangler: 4.127.1
  zod: 4.5.4

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

peerDependencyRules:
  allowedVersions:
    # tsconfck (transitive via astro) declares peer typescript@^5 but
    # works with TS 6. Drop this once upstream widens its peer range.
    tsconfck>typescript: '6'

# lhci bundles intl-messageformat which CommonJS-requires tslib without
# declaring it. Hoist tslib to the public node_modules root so the bundled
# Lighthouse subprocess can resolve it.
publicHoistPattern:
  - 'tslib'
